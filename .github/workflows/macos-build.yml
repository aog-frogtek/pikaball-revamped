# One-off macOS build: produces a universal (arm64 + x86_64) binary with embedded assets.
name: macOS build

on:
  push:
    branches: [ "macos-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install build tools
      run: brew install ninja

    - name: Configure CMake
      run: >
        cmake --preset release-embedded
        -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
        -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3

    - name: Build
      run: cmake --build --preset release-embedded

    - name: Package binary
      # tar keeps the executable bit, which upload-artifact's zip would drop
      run: |
        lipo -info build/release-embedded/pikaball_revamped
        tar -czf pikaball-revamped-macos.tar.gz -C build/release-embedded pikaball_revamped

    - uses: actions/upload-artifact@v6
      with:
        name: pikaball-revamped-macos
        path: pikaball-revamped-macos.tar.gz
